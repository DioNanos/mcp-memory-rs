[package]
name = "mcp-memory-rs"
version = "0.3.1"
edition = "2021"
description = "Local-first MCP memory server with per-device ACL and fleet sync"
license = "Apache-2.0"
authors = ["DioNanos <dev@mmmbuto.com>"]
repository = "https://github.com/DioNanos/mcp-memory-rs"
readme = "README.md"
keywords = ["mcp", "memory", "agent", "local-first", "sync"]
categories = ["command-line-utilities", "database-implementations"]
exclude = [".forgejo/**", "skills/**"]

[dependencies]
rmcp = { version = "1.7", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
schemars = "1.2"
thiserror = "2"
anyhow = "1"
libc = "0.2"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tower = "0.5"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
codegen-units = 1
